<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Movatak — Portal do Vendedor</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#080810;--bg2:#0f0f1c;--bg3:#16162a;--bg4:#1c1c32;--border:rgba(255,255,255,.08);--text:#eeeef8;--text2:#8585ad;--text3:#4c4c68;--accent:#5b7fff;--green:#00d084;--amber:#f5a623;--red:#ff5a5a;--mono:'DM Mono',monospace;--sans:'Syne',sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans)}.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5}.login.hidden{display:none}.box,.card,.panel{background:var(--bg2);border:1px solid var(--border);border-radius:18px}.box{padding:40px;width:92%;max-width:420px}.logo{width:52px;height:52px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:800}.box h1{text-align:center;margin-bottom:6px}.box p{text-align:center;color:var(--text2);font-size:14px;margin-bottom:24px}label{display:block;color:var(--text2);font-size:12px;margin:12px 0 7px}input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:13px;font-family:var(--mono)}button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-family:var(--sans);cursor:pointer}.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 30px;border-bottom:1px solid var(--border)}main{padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:20px 0}.card{padding:20px}.label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}.value{font-size:34px;font-weight:800}.green{color:var(--green)}.amber{color:var(--amber)}.accent{color:var(--accent)}.small{font-size:12px;color:var(--text3);font-family:var(--mono)}.periodos{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:4px}.periodos button{background:transparent;color:var(--text2);padding:8px 14px}.periodos button.active{background:var(--accent);color:#fff}.panel{padding:22px;margin-top:18px}.ptitle{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:800;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.barbg{height:8px;background:var(--bg4);border-radius:5px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:5px}.hidden2{display:none}.btn2{background:transparent;border:1px solid var(--border);color:var(--text2)}</style></head><body><div id="login" class="login"><div class="box"><div class="logo">M</div><h1>Portal do Vendedor</h1><p>Acompanhe suas vendas e posição no ranking.</p><label>Email</label><input id="email" type="email" placeholder="seu@email.com"><label>Senha</label><input id="senha" type="password" placeholder="sua senha"><button style="width:100%;margin-top:16px" onclick="login()">Entrar</button><div class="err" id="err"></div></div></div><div id="app" class="hidden2"><header><div><strong>Movatak</strong><div class="small" id="sub">Portal do Vendedor</div></div><div style="display:flex;gap:10px;align-items:center"><div class="periodos"><button id="p0" onclick="setPeriodo(0)">Hoje</button><button id="p7" onclick="setPeriodo(7)">7 dias</button><button id="p30" class="active" onclick="setPeriodo(30)">30 dias</button><button id="p90" onclick="setPeriodo(90)">90 dias</button></div><button class="btn2" onclick="sair()">Sair</button></div></header><main><h2 id="nome">Minhas métricas</h2><div class="grid" id="cards"></div><div class="panel"><div class="ptitle">Ranking da equipe — últimos 30 dias</div><div id="ranking"></div></div><div class="panel"><div class="ptitle">Meus últimos leads atribuídos</div><div id="leads"></div></div><div class="small" style="text-align:center;margin-top:20px">Movatak v2.0.0-vendedor</div></main></div><script>const API_BASE='https://movatakagencia-production.up.railway.app';let token=localStorage.getItem('mvtk_vendedor_token')||'',periodo=30;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(path,opt={}){const r=await fetch(API_BASE+path,{...opt,headers:{'Content-Type':'application/json','x-vendedor-token':token,...(opt.headers||{})}});if(r.status===401){sair();throw new Error('Acesso inválido.')}if(!r.ok){let t='Erro '+r.status;try{const j=await r.json();t=j.error||t}catch(e){}throw new Error(t)}return r.json()}async function login(){try{const r=await fetch(API_BASE+'/movatak/vendedor/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,senha:$('senha').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Acesso inválido.');token=j.token;localStorage.setItem('mvtk_vendedor_token',token);iniciar()}catch(e){$('err').textContent=e.message}}function sair(){localStorage.removeItem('mvtk_vendedor_token');token='';$('login').classList.remove('hidden');$('app').classList.add('hidden2')}function iniciar(){$('login').classList.add('hidden');$('app').classList.remove('hidden2');carregar()}if(token)iniciar();function setPeriodo(d){periodo=d;['0','7','30','90'].forEach(x=>$('p'+x).classList.remove('active'));$('p'+d).classList.add('active');carregar()}async function carregar(){try{const r=await api('/movatak/vendedor/resumo?dias='+periodo);$('nome').textContent='Olá, '+r.vendedor.nome;$('sub').textContent=r.vendedor.cliente_nome;render(r)}catch(e){console.error(e)}}function render(r){$('cards').innerHTML=`<div class="card"><div class="label">Leads atribuídos</div><div class="value accent">${r.leads_atribuidos||0}</div><div class="small">hoje: ${r.leads_hoje||0}</div></div><div class="card"><div class="label">Vendas</div><div class="value green">${r.vendas||0}</div><div class="small">hoje: ${r.vendas_hoje||0}</div></div><div class="card"><div class="label">Conversão</div><div class="value amber">${r.taxa_conversao||0}%</div><div class="small">período selecionado</div></div><div class="card"><div class="label">Em follow-up</div><div class="value">${r.em_followup||0}</div><div class="small">em andamento</div></div>`;const max=Math.max(...(r.ranking||[]).map(x=>parseInt(x.vendas||0)),1);$('ranking').innerHTML=(r.ranking||[]).map((x,i)=>`<div class="row"><span>${i+1}º ${esc(x.nome)}</span><strong class="${x.nome===r.vendedor.nome?'green':''}">${x.vendas||0} vendas</strong></div><div class="barbg"><div class="bar" style="width:${Math.round((x.vendas||0)/max*100)}%"></div></div>`).join('')||'<div class="small">Sem ranking ainda.</div>';$('leads').innerHTML=(r.leads||[]).map(l=>`<div class="row"><span>${esc(l.nome||l.telefone)}<br><span class="small">${esc(l.telefone)} · ${esc(l.etapa)}</span></span><span class="small">${new Date(l.criado_em).toLocaleString('pt-BR')}</span></div>`).join('')||'<div class="small">Nenhum lead atribuído.</div>'}</script></body></html>
