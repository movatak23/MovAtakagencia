<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movatak — Atendimento (protótipo)</title>
<style>
  :root{
    --bg:#0d0f14; --bg2:#161a22; --bg3:#1e232e; --border:#2a3140;
    --text:#e8eaed; --text2:#9aa3b2; --text3:#5f6878;
    --accent:#3B82F6; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

  /* Barra de config do protótipo */
  .config-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .config-bar button{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
  .config-bar button:hover{opacity:.9}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:6px}
  .status-dot.on{background:var(--green)}
  .status-dot.off{background:var(--red)}
  .status-txt{font-size:12px;color:var(--text2)}

  /* Layout principal: lista | chat */
  .layout{display:flex;height:calc(100vh - 53px)}
  .lista{width:320px;border-right:1px solid var(--border);overflow-y:auto;background:var(--bg2)}
  .lista-header{padding:12px 16px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2)}
  .conversa-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .conversa-item:hover{background:var(--bg3)}
  .conversa-item.ativa{background:var(--bg3);border-left:3px solid var(--accent)}
  .conversa-nome{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
  .conversa-tel{font-size:12px;color:var(--text3);font-family:var(--mono)}
  .setor-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}

  /* Chat */
  .chat{flex:1;display:flex;flex-direction:column;background:var(--bg)}
  .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between}
  .chat-header-nome{font-size:15px;font-weight:600}
  .chat-vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}
  .mensagens{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:65%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word}
  .msg.entrada{background:var(--bg3);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.saida{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg-hora{font-size:10px;opacity:.6;margin-top:4px;display:block}
  .compose{padding:14px 20px;border-top:1px solid var(--border);background:var(--bg2);display:flex;gap:10px}
  .compose input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:24px;font-size:14px}
  .compose button{background:var(--accent);color:#fff;border:none;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:18px}
  .compose button:disabled{opacity:.4;cursor:not-allowed}
  .empty-state{padding:40px 16px;text-align:center;color:var(--text3);font-size:13px}
</style>
</head>
<body>

<div class="config-bar">
  <strong style="font-size:15px">Atendimento</strong>
  <span class="status-txt" id="cliente-label" style="margin-left:4px">—</span>
  <span style="margin-left:auto"><span class="status-dot" id="status-dot"></span><span class="status-txt" id="status-txt">conectando...</span></span>
</div>

<div class="layout">
  <div class="lista">
    <div class="lista-header" id="lista-header">Conversas</div>
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:41px;background:var(--bg2);z-index:2">
      <input id="busca-input" placeholder="Buscar por nome ou telefone..." oninput="filtrarLista()"
        style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px">
    </div>
    <div id="lista-conversas">
      <div class="empty-state">Carregando conversas...</div>
    </div>
  </div>
  <div class="chat">
    <div class="chat-header" id="chat-header" style="display:none">
      <span class="chat-header-nome" id="chat-nome"></span>
      <span class="conversa-tel" id="chat-tel"></span>
    </div>
    <div class="chat-vazio" id="chat-vazio">Selecione uma conversa à esquerda.</div>
    <div class="mensagens" id="mensagens" style="display:none"></div>
    <div class="compose" id="compose" style="display:none">
      <input id="msg-input" placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter')enviar()">
      <button id="btn-enviar" onclick="enviar()">&#10148;</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
let BASE = '', SECRET = '', CLIENTE_ID = null;
let socket = null;
let leadAtual = null;
let leadsCache = {};

function setStatus(estado, texto){
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + (estado || '');
  document.getElementById('status-txt').textContent = texto;
}

async function api(path, opts={}){
  const res = await fetch(BASE + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'x-movatak-secret': SECRET, ...(opts.headers||{}) }
  });
  if(!res.ok){ throw new Error('HTTP ' + res.status); }
  return res.json();
}

async function conectar(){
  BASE = window.location.origin;
  const params = new URLSearchParams(window.location.search);
  CLIENTE_ID = parseInt(params.get('cliente'));
  try{
    if(window.opener && window.opener.sessionStorage){
      SECRET = window.opener.sessionStorage.getItem('mvtk_painel_secret') || '';
    }
  }catch(e){ /* mesmo domínio, não deve dar cross-origin */ }
  if(!SECRET){ SECRET = sessionStorage.getItem('mvtk_painel_secret') || ''; }

  if(!CLIENTE_ID){ setStatus('off','cliente não informado na URL'); return; }
  if(!SECRET){ setStatus('off','sessão não encontrada — abra pelo painel'); return; }

  setStatus('', 'conectando...');

  // 1) Carrega a lista de leads via REST
  try{
    const leads = await api('/movatak/admin/clientes/' + CLIENTE_ID + '/leads');
    renderLista(leads);
  }catch(e){
    setStatus('off','erro REST: ' + e.message);
    return;
  }

  // 2) Conecta o socket
  if(socket){ socket.disconnect(); }
  socket = io(BASE, { auth: { secret: SECRET }, transports:['websocket','polling'] });

  socket.on('connect', () => {
    setStatus('on','conectado');
    socket.emit('entrar-cliente', CLIENTE_ID);
  });
  socket.on('disconnect', () => setStatus('off','desconectado'));
  socket.on('connect_error', (err) => setStatus('off','erro socket: ' + err.message));

  // 3) Escuta mensagens novas ao vivo
  socket.on('mensagem:nova', (payload) => {
    const { leadId, mensagem } = payload;
    // Se a conversa aberta é a que recebeu, adiciona na tela
    if(leadAtual && leadId === leadAtual){
      adicionarMensagem(mensagem);
    }
    // Destaca na lista que chegou algo novo
    marcarNovo(leadId);
  });
}

function renderLista(leads){
  leadsCache = {};
  const wrap = document.getElementById('lista-conversas');
  document.getElementById('lista-header').textContent = 'Conversas (' + leads.length + ')';
  if(!leads.length){ wrap.innerHTML = '<div class="empty-state">Nenhum lead.</div>'; return; }
  wrap.innerHTML = leads.map(l => {
    leadsCache[l.id] = l;
    const setor = l.setor_nome
      ? `<span class="setor-badge" style="background:${l.setor_cor||'#444'}22;color:${l.setor_cor||'#aaa'}">${l.setor_nome}</span>`
      : '';
    return `<div class="conversa-item" id="conv-${l.id}" onclick="abrirConversa(${l.id})">
      <div class="conversa-nome">${escapeHtml(l.nome||'Sem nome')} ${setor}</div>
      <div class="conversa-tel">${escapeHtml(l.telefone||'')}</div>
    </div>`;
  }).join('');
}

function marcarNovo(leadId){
  const el = document.getElementById('conv-' + leadId);
  if(el && leadId !== leadAtual){
    el.style.background = 'rgba(59,130,246,.15)';
  }
}

function filtrarLista(){
  const termo = document.getElementById('busca-input').value.trim().toLowerCase();
  let visiveis = 0;
  Object.values(leadsCache).forEach(l => {
    const el = document.getElementById('conv-' + l.id);
    if(!el) return;
    const alvo = ((l.nome||'') + ' ' + (l.telefone||'')).toLowerCase();
    const bate = !termo || alvo.includes(termo);
    el.style.display = bate ? '' : 'none';
    if(bate) visiveis++;
  });
  document.getElementById('lista-header').textContent =
    termo ? `Conversas (${visiveis} de ${Object.keys(leadsCache).length})` : `Conversas (${Object.keys(leadsCache).length})`;
}

async function abrirConversa(leadId){
  leadAtual = leadId;
  const lead = leadsCache[leadId] || {};
  document.querySelectorAll('.conversa-item').forEach(e=>e.classList.remove('ativa'));
  const el = document.getElementById('conv-' + leadId);
  if(el){ el.classList.add('ativa'); el.style.background=''; }

  document.getElementById('chat-vazio').style.display='none';
  document.getElementById('chat-header').style.display='flex';
  document.getElementById('mensagens').style.display='flex';
  document.getElementById('compose').style.display='flex';
  document.getElementById('chat-nome').textContent = lead.nome || 'Sem nome';
  document.getElementById('chat-tel').textContent = lead.telefone || '';

  const cont = document.getElementById('mensagens');
  cont.innerHTML = '<div class="empty-state">Carregando histórico...</div>';
  try{
    const msgs = await api('/movatak/admin/leads/' + leadId + '/conversas');
    cont.innerHTML = '';
    msgs.forEach(adicionarMensagem);
    scrollFim();
  }catch(e){
    cont.innerHTML = '<div class="empty-state">Erro ao carregar: ' + e.message + '</div>';
  }
}

function adicionarMensagem(m){
  const cont = document.getElementById('mensagens');
  const vazio = cont.querySelector('.empty-state');
  if(vazio) vazio.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (m.direcao === 'saida' ? 'saida' : 'entrada');
  const hora = m.criado_em ? new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
  div.innerHTML = escapeHtml(m.conteudo||'') + (hora ? `<span class="msg-hora">${hora}</span>` : '');
  cont.appendChild(div);
  scrollFim();
}

function scrollFim(){
  const cont = document.getElementById('mensagens');
  cont.scrollTop = cont.scrollHeight;
}

async function enviar(){
  const input = document.getElementById('msg-input');
  const texto = input.value.trim();
  if(!texto || !leadAtual) return;
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  input.value = '';
  try{
    await api('/movatak/admin/leads/' + leadAtual + '/mensagem-rapida', {
      method:'POST',
      body: JSON.stringify({ texto })
    });
    // O socket vai ecoar de volta a mensagem de saída (registrarConversa emite),
    // então não adiciono manualmente aqui pra evitar duplicar.
  }catch(e){
    alert('Erro ao enviar: ' + e.message);
    input.value = texto;
  }finally{
    btn.disabled = false;
    input.focus();
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(function initCabecalho(){
  const params = new URLSearchParams(window.location.search);
  const nome = params.get('nome');
  const id = params.get('cliente');
  const label = document.getElementById('cliente-label');
  if(label){ label.textContent = nome ? decodeURIComponent(nome) : (id ? 'Cliente ' + id : '—'); }
})();

conectar();
</script>
</body>
</html>
