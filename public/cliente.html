<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movatak — Seus Resultados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810; --bg2:#0f0f1c; --bg3:#16162a; --bg4:#1c1c32;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#eeeef8; --text2:#7777a0; --text3:#3a3a58;
  --accent:#5b7fff; --green:#00d084; --amber:#f5a623; --red:#ff5a5a;
  --mono:'DM Mono',monospace; --sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}

/* Login */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .4s}
#login-screen.hidden{opacity:0;pointer-events:none}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;animation:fadeUp .5s ease both}
.login-logo{width:56px;height:56px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin:0 auto 20px}
.login-box h1{font-size:26px;font-weight:800;text-align:center;margin-bottom:6px}
.login-box p{font-size:14px;color:var(--text2);text-align:center;margin-bottom:36px}
.field label{font-size:12px;color:var(--text2);letter-spacing:.5px;display:block;margin-bottom:8px}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;font-size:15px;color:var(--text);font-family:var(--mono);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent)}
.login-err{font-size:13px;color:var(--red);margin-top:8px;min-height:20px}
.btn-primary{width:100%;margin-top:20px;padding:16px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:opacity .2s,transform .1s}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}

/* Layout */
.app{display:none;min-height:100vh}
.app.visible{display:block}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.header-title{font-size:18px;font-weight:800}
.header-sub{font-size:12px;color:var(--text2);margin-top:1px}
.header-right{display:flex;align-items:center;gap:16px}
.btn-sair{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:8px 16px;color:var(--text2);font-size:13px;font-family:var(--sans);cursor:pointer;transition:all .2s}
.btn-sair:hover{color:var(--text);background:var(--bg2)}

main{padding:32px}
.periodo-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.periodo-bar h2{font-size:22px;font-weight:800}
.periodo-btns{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:4px;gap:2px}
.periodo-btns button{padding:8px 20px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:all .2s}
.periodo-btns button.active{background:var(--accent);color:#fff}

/* Métricas */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;transition:border-color .2s}
.metric-card:hover{border-color:var(--border2)}
.metric-label{font-size:12px;color:var(--text2);letter-spacing:.4px;margin-bottom:10px;text-transform:uppercase}
.metric-value{font-size:32px;font-weight:800;line-height:1;margin-bottom:4px}
.metric-sub{font-size:12px;color:var(--text3)}
.metric-card.accent .metric-value{color:var(--accent)}
.metric-card.green .metric-value{color:var(--green)}
.metric-card.amber .metric-value{color:var(--amber)}
.metric-card.red-val .metric-value{color:var(--red)}

/* Painéis */
.panels{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-bottom:28px}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px}
.panel-title{font-size:14px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:20px}

/* Gráfico dividido */
.chart-split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:700px){.chart-split{grid-template-columns:1fr}}
.chart-half{min-width:0}
.chart-half-right{border-left:1px solid var(--border);padding-left:24px}
@media(max-width:700px){.chart-half-right{border-left:none;padding-left:0;border-top:1px solid var(--border);padding-top:20px}}
.half-title{font-size:12px;color:var(--text2);letter-spacing:.4px;text-transform:uppercase;margin-bottom:16px}
.chart-hours{display:flex;align-items:flex-end;gap:2px;height:140px}
.hour-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.hour-bar{width:100%;border-radius:2px 2px 0 0;background:var(--bg4);min-height:3px;transition:height .4s ease}
.hour-bar.has-leads{background:var(--accent)}
.hour-lbl{font-size:8px;color:var(--text3);font-family:var(--mono)}
.hour-val{font-size:9px;color:var(--text2);font-family:var(--mono);font-weight:600}

/* Vendas por vendedor */
.vv-item{margin-bottom:14px}
.vv-row{display:flex;justify-content:space-between;margin-bottom:5px}
.vv-nome{font-size:13px;color:var(--text)}
.vv-num{font-size:13px;font-weight:700}
.vv-bar-bg{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden}
.vv-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* Funil */
.funil-step{margin-bottom:18px}
.funil-step:last-child{margin-bottom:0}
.funil-row{display:flex;justify-content:space-between;margin-bottom:6px}
.funil-name{font-size:14px;color:var(--text2)}
.funil-num{font-size:14px;font-weight:700}
.funil-bar-bg{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden}
.funil-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.funil-pct{font-size:11px;color:var(--text3);text-align:right;margin-top:3px;font-family:var(--mono)}

/* Evolução semanal */
.evolucao-wrap{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.evo-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.evo-bars{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.evo-bar{width:14px;border-radius:3px 3px 0 0;transition:height .4s ease}
.evo-bar.leads{background:var(--bg4)}
.evo-bar.conv{background:var(--green)}
.evo-lbl{font-size:9px;color:var(--text3);font-family:var(--mono)}

/* Estados */
.state-row{text-align:center;padding:40px;color:var(--text2);font-size:14px;width:100%}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
.cpl-alerta{background:rgba(255,90,90,.1);border:1px solid var(--red);border-radius:12px;padding:14px 18px;margin-bottom:20px;font-size:13px;color:var(--red)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">M</div>
    <h1>Seus Resultados</h1>
    <p>Acompanhe a performance da sua campanha</p>
    <div class="field">
      <label>TOKEN DE ACESSO</label>
      <input type="text" id="login-input" placeholder="mvtk_..." autocomplete="off">
      <div class="login-err" id="login-err"></div>
    </div>
    <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header>
    <div class="header-left">
      <div class="header-logo">M</div>
      <div>
        <div class="header-title">Movatak</div>
        <div class="header-sub">Seus Resultados</div>
      </div>
    </div>
    <div class="header-right">
      <span id="header-status" style="font-size:12px;color:var(--text2)"></span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <main>
    <div class="periodo-bar">
      <h2 id="cliente-nome">Visão geral</h2>
      <div class="periodo-btns">
        <button onclick="setPeriodo(0)" id="p0">Hoje</button>
        <button onclick="setPeriodo(7)" id="p7">7 dias</button>
        <button onclick="setPeriodo(30)" id="p30" class="active">30 dias</button>
        <button onclick="setPeriodo(90)" id="p90">90 dias</button>
      </div>
    </div>

    <div id="cpl-alerta-wrap"></div>

    <div class="metrics-grid" id="metrics-grid">
      <div class="state-row" style="grid-column:1/-1"><div class="spinner"></div>Carregando...</div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-title" id="chart-title">Leads por hora — hoje</div>
        <div class="chart-split">
          <div class="chart-half">
            <div class="chart-hours" id="chart-hours">
              <div class="state-row"><div class="spinner"></div></div>
            </div>
          </div>
          <div class="chart-half chart-half-right">
            <div class="half-title">Vendas por vendedor</div>
            <div id="vendedores-vendas">
              <div class="state-row" style="font-size:13px">Carregando...</div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Funil consolidado</div>
        <div id="funil-wrap">
          <div class="state-row"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:28px">
      <div class="panel-title">Evolução semanal — últimos 90 dias</div>
      <div id="evolucao-wrap">
        <div class="state-row"><div class="spinner"></div></div>
      </div>
    </div>

    <div style="text-align:center;padding:8px 0;color:var(--text3);font-size:11px;font-family:var(--mono)">
      Movatak <span id="versao-painel">v1.5.0</span>
    </div>
  </main>
</div>

<script>
const API_BASE = 'https://movatakagencia-production.up.railway.app';
const PAINEL_VERSION = 'v1.5.0';
const TOKEN_KEY = 'mvtk_cliente_token';

let appToken = '';
let periodoAtual = 30;

// ── Login ──
function fazerLogin() {
  const val = document.getElementById('login-input').value.trim();
  if (!val) { document.getElementById('login-err').textContent = 'Informe o token.'; return; }
  appToken = val;
  document.getElementById('login-err').textContent = '';
  // Valida o token buscando o resumo
  api('/movatak/app/resumo?dias=7')
    .then(() => {
      localStorage.setItem(TOKEN_KEY, val);
      iniciar();
    })
    .catch(e => {
      appToken = '';
      document.getElementById('login-err').textContent =
        e.message.includes('401') ? 'Token inválido.' : 'Erro: ' + e.message;
    });
}

document.getElementById('login-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});

function sair() {
  localStorage.removeItem(TOKEN_KEY);
  appToken = '';
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.remove('visible');
}

function iniciar() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  document.getElementById('versao-painel').textContent = PAINEL_VERSION;
  carregar();
}

const savedToken = localStorage.getItem(TOKEN_KEY);
if (savedToken) { appToken = savedToken; iniciar(); }

// ── API ──
async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'x-app-token': appToken,
      ...(opts.headers || {})
    }
  });
  if (res.status === 401) { sair(); throw new Error('401'); }
  if (!res.ok) throw new Error('Erro ' + res.status);
  return res.json();
}

function atualizarStatus(txt) {
  document.getElementById('header-status').textContent = txt;
}

// ── Período ──
function setPeriodo(d) {
  periodoAtual = d;
  ['0','7','30','90'].forEach(x => document.getElementById('p'+x).classList.remove('active'));
  document.getElementById('p'+d).classList.add('active');
  carregar();
}

// ── Carregamento ──
async function carregar() {
  atualizarStatus('Atualizando...');
  try {
    const [resumo, evolucao] = await Promise.all([
      api('/movatak/app/resumo?dias=' + periodoAtual),
      api('/movatak/app/evolucao').catch(() => [])
    ]);
    renderMetricas(resumo);
    renderGraficoHoras(resumo.leads_por_hora);
    renderVendedores(resumo.vendedores);
    renderFunil(resumo);
    renderCplAlerta(resumo);
    renderEvolucao(evolucao);
    atualizarStatus('Atualizado agora');
  } catch(e) {
    atualizarStatus('Erro: ' + e.message);
  }
}

// ── Métricas ──
function renderMetricas(r) {
  const total = parseInt(r.total_leads || 0);
  const conv  = parseInt(r.convertidos || 0);
  const taxa  = total > 0 ? ((conv / total) * 100).toFixed(1) : '0.0';
  const taxaColor = parseFloat(taxa) >= 20 ? 'green' : parseFloat(taxa) >= 10 ? 'amber' : 'red-val';
  const cpl = r.cpl_calculado ? 'R$ ' + r.cpl_calculado : '—';
  document.getElementById('metrics-grid').innerHTML = `
    <div class="metric-card accent">
      <div class="metric-label">Total de leads</div>
      <div class="metric-value">${total}</div>
      <div class="metric-sub">leads hoje: ${r.leads_hoje || 0}</div>
    </div>
    <div class="metric-card green">
      <div class="metric-label">Convertidos</div>
      <div class="metric-value">${conv}</div>
      <div class="metric-sub">vendas hoje: ${r.vendas_hoje || 0}</div>
    </div>
    <div class="metric-card amber">
      <div class="metric-label">Em follow up</div>
      <div class="metric-value">${r.em_followup || 0}</div>
      <div class="metric-sub">sequência ativa</div>
    </div>
    <div class="metric-card ${taxaColor}">
      <div class="metric-label">Taxa de conversão</div>
      <div class="metric-value">${taxa}%</div>
      <div class="metric-sub">fechamento</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Custo por lead</div>
      <div class="metric-value" style="font-size:26px">${cpl}</div>
      <div class="metric-sub">${r.teto_cpl ? 'teto: R$ ' + r.teto_cpl : 'CPL calculado'}</div>
    </div>
  `;
}

function renderCplAlerta(r) {
  const wrap = document.getElementById('cpl-alerta-wrap');
  if (r.alerta_cpl) {
    wrap.innerHTML = `<div class="cpl-alerta">⚠️ Seu custo por lead (R$ ${r.cpl_calculado}) está acima do teto acordado (R$ ${r.teto_cpl}). Estamos ajustando as campanhas.</div>`;
  } else {
    wrap.innerHTML = '';
  }
}

// ── Gráfico de leads por hora ──
function renderGraficoHoras(leadsPorHora) {
  const wrap = document.getElementById('chart-hours');
  if (!leadsPorHora || !leadsPorHora.length) {
    wrap.innerHTML = '<div class="state-row" style="font-size:13px">Sem leads hoje</div>';
    return;
  }
  const max = Math.max(...leadsPorHora.map(h => h.leads), 1);
  wrap.innerHTML = leadsPorHora.map(h => {
    const altura = h.leads > 0 ? Math.max(6, (h.leads / max) * 110) : 3;
    const lbl = h.hora % 3 === 0 ? String(h.hora).padStart(2,'0') : '';
    return `<div class="hour-col">
      <div class="hour-val">${h.leads > 0 ? h.leads : ''}</div>
      <div class="hour-bar${h.leads > 0 ? ' has-leads' : ''}" style="height:${altura}px"></div>
      <div class="hour-lbl">${lbl}</div>
    </div>`;
  }).join('');
}

// ── Vendas por vendedor ──
function renderVendedores(vendedores) {
  const wrap = document.getElementById('vendedores-vendas');
  if (!vendedores || !vendedores.length) {
    wrap.innerHTML = '<div class="state-row" style="font-size:13px">Nenhum vendedor cadastrado</div>';
    return;
  }
  const max = Math.max(...vendedores.map(v => parseInt(v.fechamentos || 0)), 1);
  wrap.innerHTML = vendedores.map((v, i) => {
    const fech = parseInt(v.fechamentos || 0);
    const pct  = Math.round((fech / max) * 100);
    const cor  = i === 0 ? 'var(--green)' : i === 1 ? 'var(--accent)' : 'var(--amber)';
    return `<div class="vv-item">
      <div class="vv-row">
        <span class="vv-nome">${v.nome}</span>
        <span class="vv-num" style="color:${cor}">${fech} ${fech === 1 ? 'venda' : 'vendas'}</span>
      </div>
      <div class="vv-bar-bg"><div class="vv-bar-fill" style="width:${pct}%;background:${cor}"></div></div>
    </div>`;
  }).join('');
}

// ── Funil ──
function renderFunil(r) {
  const total = parseInt(r.total_leads || 0);
  const fu    = parseInt(r.em_followup || 0);
  const conv  = parseInt(r.convertidos || 0);
  function step(label, valor, color) {
    const pct = total > 0 ? Math.round((valor / total) * 100) : 0;
    return `<div class="funil-step">
      <div class="funil-row">
        <span class="funil-name">${label}</span>
        <span class="funil-num" style="color:${color}">${valor}</span>
      </div>
      <div class="funil-bar-bg"><div class="funil-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="funil-pct">${pct}%</div>
    </div>`;
  }
  document.getElementById('funil-wrap').innerHTML =
    step('Leads', total, 'var(--accent)') +
    step('Follow up', fu, 'var(--amber)') +
    step('Clientes', conv, 'var(--green)');
}

// ── Evolução semanal ──
function renderEvolucao(semanas) {
  const wrap = document.getElementById('evolucao-wrap');
  if (!semanas || !semanas.length) {
    wrap.innerHTML = '<div class="state-row" style="font-size:13px">Sem dados de evolução ainda</div>';
    return;
  }
  const max = Math.max(...semanas.map(s => parseInt(s.leads || 0)), 1);
  const html = semanas.map(s => {
    const leads = parseInt(s.leads || 0);
    const conv  = parseInt(s.convertidos || 0);
    const hLeads = Math.max(4, (leads / max) * 90);
    const hConv  = Math.max(2, (conv / max) * 90);
    const d = new Date(s.semana);
    const lbl = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    return `<div class="evo-col">
      <div class="evo-bars">
        <div class="evo-bar leads" style="height:${hLeads}px" title="${leads} leads"></div>
        <div class="evo-bar conv" style="height:${hConv}px" title="${conv} convertidos"></div>
      </div>
      <div class="evo-lbl">${lbl}</div>
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="evolucao-wrap">${html}</div>
    <div style="display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--text2)">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--bg4);border-radius:2px;margin-right:5px"></span>Leads</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:2px;margin-right:5px"></span>Convertidos</span>
    </div>`;
}

// Auto refresh a cada 2 minutos
setInterval(() => { if (appToken) carregar(); }, 120000);
</script>
</body>
</html>
